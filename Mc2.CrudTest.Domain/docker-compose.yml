version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql_server_container
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=1qaz!QAZ
    ports:
      - "1433:1433"
    networks:
      - app-network

  webapp:
    build: .
    container_name: sqlserverapp_container
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app-network
    depends_on:
      - sqlserver

networks:
  app-network:
    driver: bridge
